name: Release

# Releasing is a choice, separate from merging: main can hold unreleased work. The version lives in the release tag,
# not in the repo, so there are no version-bump PRs. To release what's on main now:
#   Actions > Release > Run workflow, version 1.2.3      (or: gh workflow run release.yml -f version=1.2.3)
# or push a tag v1.2.3 on main. Either way: tests, then a signed APK built as that version, then the tag (if it
# isn't there yet) and the GitHub Release. The app's "Check for updates" reads the latest release and offers its .apk.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 1.2.3 (patch for fixes, minor for features)"
        required: true
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # From main only (by tag or Run workflow), merged commits only, a version versionCode can hold, newer than
      # the latest. Tested in test/release-check.test.ts.
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
        run: sh scripts/release-check.sh

  test:
    needs: check
    uses: ./.github/workflows/ci.yml

  apk:
    name: Signed APK
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: v${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build as this version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.LIVELINE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret LIVELINE_KEYSTORE_B64 is missing, so the APK can't be signed."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          LIVELINE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          LIVELINE_KEYSTORE_PASSWORD: ${{ secrets.LIVELINE_KEYSTORE_PASSWORD }}
          LIVELINE_KEY_ALIAS: ${{ secrets.LIVELINE_KEY_ALIAS }}
          LIVELINE_KEY_PASSWORD: ${{ secrets.LIVELINE_KEY_PASSWORD }}
        run: |
          npm ci
          npm run android:release

      - name: Check the APK is signed and is this version
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt2" dump badging "$apk" | grep -q "versionName='$VERSION'" || { echo "::error::APK isn't version $VERSION"; exit 1; }
          cp "$apk" "LiveLine-$TAG.apk"
          sha256sum "LiveLine-$TAG.apk" > "LiveLine-$TAG.apk.sha256"

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "LiveLine-$TAG.apk" "LiveLine-$TAG.apk.sha256" \
            --target "${{ needs.check.outputs.sha }}" --title "LiveLine $TAG" --generate-notes
