name: Release

# Releasing is a choice, separate from merging: main can hold unreleased work. The version lives in the release tag,
# not in the repo, so there are no version-bump PRs. To release what's on main now:
#   Actions > Release > Run workflow, version 1.2.3      (or: gh workflow run release.yml -f version=1.2.3)
# or push a tag v1.2.3 on main. Either way: tests, then a signed APK built as that version, then the tag (if it
# isn't there yet) and the GitHub Release. The app's "Check for updates" reads the latest release and offers its .apk.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 1.2.3 (patch for fixes, minor for features)"
        required: true
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then v="${INPUT#v}"; else v="${GITHUB_REF_NAME#v}"; fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$v\" isn't a version like 1.2.3."; exit 1
          fi
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::v$v is already released. Pick the next version."; exit 1
          fi
          latest="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo v0.0.0)"
          if [ "$(printf '%s\n%s\n' "${latest#v}" "$v" | sort -V | tail -1)" != "$v" ]; then
            echo "::error::v$v isn't newer than the latest release ($latest), so phones wouldn't take it as an update."; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME isn't on main. Release only what's been merged."; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "Releasing v$v from $GITHUB_SHA"

  test:
    needs: check
    uses: ./.github/workflows/ci.yml

  apk:
    name: Signed APK
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: v${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build as this version
        working-directory: app
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.LIVELINE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret LIVELINE_KEYSTORE_B64 is missing, so the APK can't be signed."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        working-directory: app
        env:
          LIVELINE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          LIVELINE_KEYSTORE_PASSWORD: ${{ secrets.LIVELINE_KEYSTORE_PASSWORD }}
          LIVELINE_KEY_ALIAS: ${{ secrets.LIVELINE_KEY_ALIAS }}
          LIVELINE_KEY_PASSWORD: ${{ secrets.LIVELINE_KEY_PASSWORD }}
        run: |
          npm ci
          npm run android:release

      - name: Check the APK is signed and is this version
        run: |
          apk=app/android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt2" dump badging "$apk" | grep -q "versionName='$VERSION'" || { echo "::error::APK isn't version $VERSION"; exit 1; }
          cp "$apk" "LiveLine-$TAG.apk"
          sha256sum "LiveLine-$TAG.apk" > "LiveLine-$TAG.apk.sha256"

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "LiveLine-$TAG.apk" "LiveLine-$TAG.apk.sha256" \
            --target "${{ needs.check.outputs.sha }}" --title "LiveLine $TAG" --generate-notes
