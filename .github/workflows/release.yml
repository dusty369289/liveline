name: Release

# Push a tag vX.Y.Z (matching app/package.json) to build a signed APK and publish it as a GitHub Release.
# The app's "Check for updates" reads the latest release and offers its .apk.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  apk:
    name: Signed APK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches app/package.json
        run: |
          want="v$(node -p "require('./app/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match app/package.json ($want). Bump the version, commit, tag again."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.LIVELINE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret LIVELINE_KEYSTORE_B64 is missing, so the APK can't be signed."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        working-directory: app
        env:
          LIVELINE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          LIVELINE_KEYSTORE_PASSWORD: ${{ secrets.LIVELINE_KEYSTORE_PASSWORD }}
          LIVELINE_KEY_ALIAS: ${{ secrets.LIVELINE_KEY_ALIAS }}
          LIVELINE_KEY_PASSWORD: ${{ secrets.LIVELINE_KEY_PASSWORD }}
        run: |
          npm ci
          npm run android:release

      - name: Check the APK is signed
        run: |
          apk=app/android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" "LiveLine-$GITHUB_REF_NAME.apk"
          sha256sum "LiveLine-$GITHUB_REF_NAME.apk" > "LiveLine-$GITHUB_REF_NAME.apk.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "LiveLine-$GITHUB_REF_NAME.apk" "LiveLine-$GITHUB_REF_NAME.apk.sha256" \
            --title "LiveLine $GITHUB_REF_NAME" --generate-notes --verify-tag
