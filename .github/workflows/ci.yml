name: CI

# Runs on pull requests that are ready for review, and when a release calls it. Not on drafts (open a PR as a draft
# while it's being worked on, and mark it ready once), and not on main after a merge: a rebase merge of an up-to-date
# branch puts exactly the tested commits on main, and a release runs everything again itself.
# The two job names, "Checks" and "Browser", are the required checks in the "main" ruleset: rename a job and the
# ruleset must change with it, or no PR can merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch: # run by hand on any branch

permissions:
  contents: read

# A new push to the same PR cancels the run it makes pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The same command as locally: typecheck, unit tests (with the architecture rules and the timing review,
      # which keeps no baselines here because CI machines are thrown away), leak check, web build.
      - run: npm run check

  browser:
    name: Browser
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Contact sheet and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report
          path: |
            .ui-report
            test-results
          include-hidden-files: true # .ui-report starts with a dot, which is otherwise skipped silently
          if-no-files-found: warn
          retention-days: 14
