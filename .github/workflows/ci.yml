name: CI

# Runs on pull requests, and when a release calls it. Not on plain branch pushes (push a branch freely while working;
# opening its PR is what runs CI, once), and not on main after a merge: a rebase merge of an up-to-date branch puts
# exactly the tested commits on main, and a release runs everything again itself.
# Never skip these jobs with `if:`: GitHub counts a skipped required check as passed, so a PR could merge untested.
# The two job names, "Checks" and "Browser", are the required checks in the "main" ruleset: rename a job and the
# ruleset must change with it, or no PR can merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch: # run by hand on any branch

permissions:
  contents: read

# A new push to the same PR cancels the run it makes pointless. Nothing else cancels: a run by hand on main must never
# cancel (or, waiting in the same group, replace) a release's tests. Called from release.yml, github.workflow and
# github.event_name are the release's own, so its tests get a group of their own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The workflows themselves: GitHub's schema and expressions, and shellcheck over every run: script. A broken
      # release.yml would otherwise only show itself on release day.
      - name: Lint the workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The same command as locally: typecheck, unit tests (with the architecture rules and the timing review,
      # which keeps no baselines here because CI machines are thrown away), leak check, web build.
      - run: npm run check

  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Contact sheet and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-report
          path: |
            .ui-report
            test-results
          include-hidden-files: true # .ui-report starts with a dot, which is otherwise skipped silently
          if-no-files-found: warn
          retention-days: 14
