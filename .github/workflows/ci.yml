name: CI

# Runs on pull requests, and when a release calls it. Not on plain branch pushes (push a branch freely while working;
# opening its PR is what runs CI, once), and not on main after a merge: a rebase merge of an up-to-date branch puts
# exactly the tested commits on main, and a release runs everything again itself.
# Never skip these jobs with `if:`: GitHub counts a skipped required check as passed, so a PR could merge untested.
# The two job names, "Checks" and "Browser", are the required checks in the "main" ruleset: rename a job and the
# ruleset must change with it, or no PR can merge.
on:
  pull_request:
    # "edited": a changed title or body is checked again (history-check.mjs), since it's public the moment it's saved
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_call:
  workflow_dispatch: # run by hand on any branch

permissions:
  contents: read

# A new push to the same PR cancels the run it makes pointless. Nothing else cancels: a run by hand on main must never
# cancel (or, waiting in the same group, replace) a release's tests. Called from release.yml, github.workflow and
# github.event_name are the release's own, so its tests get a group of their own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the whole history, so the PR's own commits can be checked
      # The workflows themselves: GitHub's schema and expressions, and shellcheck over every run: script. A broken
      # release.yml would otherwise only show itself on release day.
      - name: Lint the workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      # The release builds and signs the APK with android/gradle/wrapper/gradle-wrapper.jar, a binary in the repo:
      # check it is one Gradle published before anything runs it. The release runs this job too. Pinned to a commit
      # so a moved tag can't change what runs; the distribution it downloads is pinned by distributionSha256Sum.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The PR's commits (author, committer, message) and its title and body: no local hook vouches for commits made
      # elsewhere or for PR text. Only the PR's own commits: never main's. The text goes through env, never into the
      # shell line. With no PR (a release calling this), there's nothing to check.
      - name: History and PR text
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # Dependabot's PRs carry its commits and an upstream changelog body (history-check.mjs)
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ -n "$HEAD" ]; then
            # main's own commits are left out even if the PR's base is older (GitHub stamps their committer itself)
            main=$(git rev-parse -q --verify refs/remotes/origin/main || true)
            node scripts/history-check.mjs "$HEAD" --not "$BASE" ${main:+"$main"} # left out when there's no main
          else
            node scripts/history-check.mjs
          fi
      - run: npm ci
      # The same command as locally: typecheck, unit tests (with the architecture rules and the timing review,
      # which keeps no baselines here because CI machines are thrown away), leak check, web build.
      - run: npm run check
      # The Android code's JVM unit tests (android/app/src/test): the checksum check that decides whether a downloaded
      # update is installed. The runner has the Android SDK; JDK 21 matches the release build.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Gradle's ~150 MB download is the step most likely to hit a passing GitHub or Gradle hiccup (a 504 and a 10 s
      # timeout, 2026-11-08): fetch it on its own, three tries, before anything depends on it. A real outage still fails.
      - name: Fetch Gradle
        working-directory: android
        run: for attempt in 1 2 3; do ./gradlew --version --quiet && exit 0; echo "Gradle download failed (try $attempt)"; sleep 20; done; exit 1
      - run: npm run android:test

  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Contact sheet and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-report
          path: |
            .ui-report
            test-results
          include-hidden-files: true # .ui-report starts with a dot, which is otherwise skipped silently
          if-no-files-found: warn
          retention-days: 14
