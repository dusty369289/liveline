name: CI

# Every PR and every push to main. The two job names are the required checks in the "main" ruleset: rename a job
# and the ruleset must change with it, or PRs can't merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: No personal details in tracked files
        run: npm run leak-check
      - name: Web build
        run: npx vite build
